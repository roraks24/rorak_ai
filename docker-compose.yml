# Local full-stack environment: PostgreSQL + API + static frontend.
#
#   cp .env.example .env      # set GROQ_API_KEY (and JWT_SECRET_KEY)
#   docker compose up --build
#
# Frontend: http://localhost:3000   API docs: http://localhost:8000/docs

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rorak
      POSTGRES_PASSWORD: rorak
      POSTGRES_DB: rorak
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rorak"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rorak:rorak@db:5432/rorak
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - documents:/app/documents
      - hf-cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  documents:
  hf-cache:
