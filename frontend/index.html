<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover">
    <title>Rorak AI | Your AI Assistant</title>
    
    <!-- Meta & SEO Tags -->
    <meta name="description" content="Rorak AI — Your AI Assistant for document-grounded knowledge, analysis, and exploration.">
    <meta property="og:title" content="Rorak AI | Your AI Assistant">
    <meta property="og:description" content="Rorak AI is a document-grounded generative AI assistant. Upload documents and explore grounded answers.">
    <meta property="og:url" content="https://rorak.tech">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Rorak AI | Your AI Assistant">
    <meta name="twitter:description" content="Rorak AI is a document-grounded generative AI assistant. Upload documents and explore grounded answers.">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='32' height='32' rx='6' fill='%23111'/%3E%3Cpath d='M8 5h11c4.5 0 8 3.2 8 7.5 0 3.5-2.2 6.2-5.5 7.2L28 28h-5.5l-6-8H13v8H8V5zm5 4v7.5h5.5c2.5 0 4.5-1.7 4.5-3.8s-2-3.7-4.5-3.7H13z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <!-- Markdown Parser and DOM Sanitizer for secure rich text rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
</head>
<body>

    <div class="app">

        <!-- Top disclaimer banner -->
        <div class="disclaimer-bar">
            Rorak AI can make mistakes. Check important info.
        </div>

        <div class="app-body">

            <!-- Mobile menu toggle -->
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Sidebar panel -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <!-- Brand + Mobile Close -->
                    <div class="sidebar-brand">
                        <div class="brand-left">
                            <img src="logo.jpg" alt="Rorak AI" class="brand-logo">
                            <span class="brand-text">Rorak AI</span>
                        </div>
                        <button class="btn-sidebar-close" id="sidebarCloseBtn" aria-label="Close sidebar">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Navigation -->
                    <nav class="sidebar-nav">
                        <a class="nav-item active" id="navChatBtn" href="#">
                            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            Chat
                        </a>
                        <div class="nav-item disabled">
                            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
                            Memory
                            <span class="nav-badge">Coming Soon</span>
                        </div>
                    </nav>
                </div>

                <div class="sidebar-bottom">
                    <div class="sidebar-tagline">
                        <svg class="tagline-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
                        <span>Rorak AI remembers, understands, and helps you achieve more.</span>
                    </div>
                    <div class="sidebar-footer">
                        <div class="user-avatar">R</div>
                    </div>
                </div>
            </aside>

            <!-- Mobile sidebar overlay -->
            <div class="sidebar-overlay" id="sidebarOverlay"></div>

            <!-- Main content area -->
            <main class="main is-empty" id="mainArea">

                <!-- Empty state hero container (centered before first message) -->
                <div class="empty-state" id="emptyState">
                    <h1 class="empty-title" id="emptyGreeting">Ready when you are.</h1>
                </div>

                <!-- Chat messages (visible when active) -->
                <div class="chat-messages" id="chatMessages"></div>

                <!-- Input area (centered on landing, pinned bottom during chat) -->
                <div class="input-area" id="inputArea">
                    <div class="notification" id="notification"></div>
                    <div class="upload-indicator" id="uploadIndicator"></div>
                    
                    <div class="input-bar">
                        <button class="btn-upload" id="uploadBtn" title="Upload PDF">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <input
                            type="text"
                            class="chat-input"
                            id="chatInput"
                            placeholder="Ask anything"
                            autocomplete="off"
                        >
                        <div class="input-actions">
                            <button class="btn-grounded-pill" id="groundedBadge" title="Grounded RAG Mode Active">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"></path>
                                    <path d="M9 21h6"></path>
                                </svg>
                                <span>Grounded</span>
                            </button>
                            <button class="btn-send" id="sendBtn" title="Send">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"/>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                </div>

                <!-- Hidden file input for PDF upload -->
                <input type="file" id="fileInput" accept=".pdf" hidden>

            </main>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
